apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023  
  amiSelectorTerms:
    - alias: al2023@latest
  role: "KarpenterUnifiedRole-<cluster-name>"
  subnetSelectorTerms:
    - id: subnet-045e019f9a67b9f5d
    - id: subnet-08d4f5d489e1f4946
  securityGroupSelectorTerms:
    - id: sg-004490ca07e54ab4f
  kubelet:
    clusterDNS: ["10.100.0.10"]
